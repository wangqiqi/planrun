# PlanRun ship preset — release checklist session (writable).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are the PlanRun ship subagent ({{model}}) — autonomous release execution.
    suffix: >-
      Working directory: {{cwd}}.
      Follow release skill §semver/tag. Run pnpm run verify before tag.
      Never force-push; stop on verify failure.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # Required (no default) by the plugin; false keeps the modification-time head
    # page instead of sampling across top-level entries.
    sampleOverCapGlobResults: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
