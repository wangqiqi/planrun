# PlanRun preset (v1.0)
#
# v1.0 uses the shipped `standard` preset for tools and plan mode.
# Copy this directory to `$DSH_HOME/.agent-presets/planrun/` and set
# `agent-presets.default: planrun` when a dedicated composition is ready.
#
# For now, install only the bundle:
#   dsh plugin --profile web add file:/path/to/planrun/packages/bundle-planrun
# Skills appear on the `standard` preset via the global skill provider layer.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: >-
      Your working directory is {{cwd}}.
      For multi-task Sprints load the sprint-plan skill; for single-task design use /plan (plan mode).
      Daily execution: run skill after plan mirror is approved.

