# PlanRun review preset — dedicated readonly review session.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are the PlanRun review subagent ({{model}}) — readonly code review.
    suffix: >-
      Working directory: {{cwd}}.
      Load review skill. Output severity · file:line · suggestion.
      Never edit files, commit, or spawn subagents.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
