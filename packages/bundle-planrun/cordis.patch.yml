# Mount PlanRun bundled skills on host-backed profiles (web, headless, …).
# Requires dsh-base (or any profile that already includes ctx.skills + tool-skill).
# The four planrun agent presets ride the sibling `presets.patch.yml` layer,
# declared as `@deepseek-ai/dsh-agent-preset` rows; there is no preset-root
# directory to register.

- insert:
    - id: planrun-skills
      name: '@planrun/skill-provider'
    - id: planrun-workflow
      name: '@planrun/workflow'
