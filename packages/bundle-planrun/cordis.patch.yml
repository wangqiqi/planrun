# Mount PlanRun bundled skills on host-backed profiles (web, headless, …).
# Requires dsh-base (or any profile that already includes ctx.skills + tool-skill).

- insert:
    - id: planrun-skills
      name: '@planrun/skill-provider'

# Optional: register the planrun preset root when copied to a known path.
# Uncomment after `install-planrun.sh --preset`:
#
# - id: agent-presets
#   config:
#     roots:
#       - path: !!js require('node:path').join(require('node:os').homedir(), '.dsh', '.agent-presets')
#         trust: user
