# GENERATED by scripts/gen-presets.mjs — do not edit by hand.
# Source: presets/<id>/{preset.yml,plugins.yml}
# DSH reads agent presets only as `@deepseek-ai/dsh-agent-preset` declarations
# carried by a bundle patch; the legacy $DSH_HOME/.agent-presets directory is dead.
- insert:
    - id: preset-planrun
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: planrun
        name: PlanRun workflow
        description: >-
          PlanRun Sprint persona plus delegation tools (subagent_review · subagent_spike ·
          subagent_ship). Use with @planrun/bundle skills; or pick child presets for dedicated sessions.
        order: 50
        plugins:
          # PlanRun agent preset — Sprint workflow persona + delegation.
          # Shipped by @planrun/bundle/presets.patch.yml as an `@deepseek-ai/dsh-agent-preset`
          # declaration (generated by scripts/gen-presets.mjs — edit this file, not the patch).
          # Recommended session: keep DSH **standard** preset + @planrun/bundle skills;
          # switch to **planrun** when you want bundled subagent_review | subagent_spike | subagent_ship tools.
          #
          # Child agents are readonly/writable through their own presets: each named tool
          # selects `agentPreset: planrun-{review,spike,ship}` — DSH ≥0.2 removed the
          # per-tool persona and tool-filter config, and a preset is the supported way to
          # give a child a fixed persona and a restricted tool set.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a PlanRun workflow agent ({{model}}).
              suffix: >-
                Multi-task Sprints: load sprint-plan skill; single-task design: DSH /plan (plan mode).
                After plan mirror is PLAN_APPROVED, load run skill.
                Delegate readonly review to subagent_review; research to subagent_spike; release checklist to subagent_ship.
                Persona voice: default dashu; user may summon via master §人格·呼叫 — never skip verify for tone.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # Required (no default) by the plugin; false keeps the modification-time head
              # page instead of sampling across top-level entries.
              sampleOverCapGlobResults: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                # Registers send_message, interrupt_agent, and list_agents together.

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              - id: tool-subagent-review
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_review
                  agentPreset: planrun-review

              - id: tool-subagent-spike
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_spike
                  agentPreset: planrun-spike

              - id: tool-subagent-ship
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_ship
                  agentPreset: planrun-ship

